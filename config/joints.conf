# sandboxWM — скрепление окон (концепт §4)
# Super+E / Super+S / Super+R, затем ЛКМ по первому и по второму окну.

[joints.weld]
# 0 = неразрушимый шов
break_force = 0.0

[joints.spring]
stiffness = 200.0
damping = 10.0
# 0 = текущее расстояние между точками крепления
rest_length = 0.0
color = "#7fd18b"

[joints.rope]
segment_length = 20.0
max_length = 600.0
collides_with_linked_windows = false
