# sandboxWM — режимы гравитации (концепт §1)
# Режим 1 — physics.gravity_y; режимы 2–4 настраиваются здесь.

[gravity_modes]
# Длительность плавного перехода физика ↔ тайлинг, сек
freeze_transition_secs = 0.35
# Порог скорости «улёгшегося» окна, px/s
freeze_settle_speed = 5.0
# Режим 4: гравитация в невесомости
weightless_gravity_y = 0.0
# Режим 4: затухание скорости (меньше → окна дольше плывут)
weightless_linear_damping = 0.3
