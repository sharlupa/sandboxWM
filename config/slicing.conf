# sandboxWM — разрезание окон (концепт §7)
# Super+X, затем провести ножом (ЛКМ) поперёк окна: разрез идёт по линии
# штриха под любым углом (почти горизонтальный/вертикальный — ровно по оси).

[slicing]
# Минимальная толщина кусочка от линии разреза, px. 0 — без ограничения.
min_piece_size = 0.0
# На сколько части расходятся после разреза, px.
cut_gap = 4.0
