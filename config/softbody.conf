# sandboxWM — мягкие тела / деформация окон (концепт §5–6)
# Super+J — тело окна по кругу: жёсткое → мягкое → желе.
# Super+Shift+ЛКМ — тянуть мягкое окно или желе за край (жёсткое просто тащится).

[soft_body]
# Мягкое окно: мнётся и вытягивается, часть деформации остаётся.
softness = 0.5
impact_squash = 0.5
plasticity = 0.7
# Желе: колышется от ударов и рывков и всегда возвращает форму.
jelly_softness = 0.9
jelly_impact_squash = 0.9
mesh_resolution = 10
text_reprojection = true
