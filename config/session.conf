# sandboxWM — сохранение/восстановление сессии (концепт §3)

[session]
enabled = true
autosave = true
autosave_interval_secs = 60
# Пусто = $XDG_STATE_HOME/sandboxWM/session.toml
save_path = ""
format = "toml"
# Перезапускать приложения, окна которых были открыты при выходе
restore_apps = true
restore_timeout_secs = 30
