# sandboxWM — рисование физических линий и материалы (концепт §2)
# Super+P включает инструмент; ЛКМ рисует, ПКМ стирает линию под курсором,
# 1–4 выбирают материал (сталь/клей/батут/верёвка), Delete стирает всё, Esc — выход.

[drawing]
min_point_spacing = 8.0
default_thickness = 12.0
max_points = 512
preview_color = "#ffffff"
default_material = "steel"

# Сталь: полка, на которую можно ставить окна
[materials.steel]
friction = 0.8
restitution = 0.05
thickness = 12.0
color = "#8a8f98"

# Клей: окно прилипает при касании; оторвать — резко дёрнуть мышью
[materials.glue]
friction = 5.0
restitution = 0.0
thickness = 10.0
color = "#c9a227"
detach_force = 2000.0

# Батут: окна отскакивают
[materials.trampoline]
friction = 0.3
restitution = 1.4
thickness = 10.0
color = "#3aa1ff"

# Верёвка: падает и болтается; на свободный конец можно подвесить окно
[materials.rope]
segment_length = 20.0
segment_count = 64
thickness = 6.0
color = "#b07a48"
joint_stiffness = 1.0
pin = "start"          # "start" | "both" | "none"
hook_windows = true
