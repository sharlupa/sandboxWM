# sandboxWM — физика и управление
#
# Где искать конфиг (первая найденная директория):
#   $SANDBOXWM_CONFIG
#   $XDG_CONFIG_HOME/sandboxWM/
#   ~/.config/sandboxWM/
#   ./config/  ← эта папка, если запускать из корня репозитория
#
# Все *.conf в директории сливаются потаблично (повторная секция в другом
# файле дополняет/перекрывает ключи, а не ломает загрузку). Любое поле можно
# опустить — подставится значение по умолчанию из src/config.rs.

# ── Физика ─────────────────────────────────────────────────────────
[physics]
# Шаг симуляции, секунды (1/60)
physics_dt = 0.016666668
gravity_y = 1500.0
# floor_y не задан → пол на нижнем краю экрана. Можно задать вручную:
# floor_y = 2000.0
floor_half_w = 50000.0
floor_half_h = 100.0
floor_visible = true
floor_color = "#cccccc"
# Два ряда точек в шахматном порядке под полом
floor_dots = true
density = 0.002
linear_damping = 1.5
angular_damping = 3.5
friction = 0.85
restitution = 0.2
max_drag_speed = 12000.0
spin_rate = 2.0
camera_step = 120.0
camera_lerp = 0.15
zoom_min = 0.1
zoom_max = 3.0

# ── Управление ─────────────────────────────────────────────────────
# Имена клавиш: Return, Escape, Left/Right/Up/Down, a–z, 0–9, F1–F12.
# Все сочетания — с Super. VT: Ctrl+Alt+Fn (не настраивается).
# Super+1…9, 0 — рабочие столы, Super+Shift+цифра — перенести окно
# (количество столов — в workspaces.conf).
[controls]
terminal = "kitty"
spawn_terminal = "Return"
quit = ["q", "Escape"]
close_window = "w"
toggle_physics = "g"
spin_left = "a"
spin_right = "d"
camera_left = "Left"
camera_right = "Right"
camera_up = "Up"
camera_down = "Down"
fullscreen = "f"       # окно на весь экран (игры, видео) ↔ обратно

# Режимы гравитации (концепт §1)
gravity_normal = "F1"  # обычная гравитация
gravity_tiling = "F2"  # гравитация выкл. → плавный переход в тайлинг
float_window = "F3"    # невесомость только для активного окна
gravity_zero = "F4"    # невесомость для всех

# Инструменты физического режима
draw_tool = "p"        # рисование линий (внутри: 1–4 материал, ПКМ стереть)
knife_tool = "x"       # нож: разрезать окно
weld_windows = "e"     # сварка двух окон
spring_windows = "s"   # пружина между окнами
rope_windows = "r"     # верёвка между окнами
unlink_window = "u"    # снять связи и крепления активного окна
toggle_soft = "j"      # мягкое/жёсткое окно
restore_window = "z"   # вернуть форму и склеить разрезанные части
gather_windows = "c"    # собрать разбросанные окна в кадр
save_session = "F5"    # сохранить сессию сейчас
